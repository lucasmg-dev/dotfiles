# Shell
set-option -g default-shell /opt/homebrew/bin/fish

# Soporte de colores
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse
set -g mouse on

# Empezar índices en 1
set -g base-index 1
setw -g pane-base-index 1

# Renumerar ventanas al cerrar
set -g renumber-windows on

# Historial
set -g history-limit 50000

# Prefix: Ctrl+a (más cómodo que Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# División de paneles más intuitiva
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navegación entre paneles estilo vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Recargar configuración
bind r source-file ~/.tmux.conf \; display-message "Config recargada"

# Sin delay en escape
set -sg escape-time 0

# Bordes de paneles
set -g pane-border-lines single
set -g pane-border-indicators off

# Status bar (GitHub Dark Default — hand-rolled, sin plugin de tema)
set -g status on
set -g status-position top
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 150
set -g status-style "bg=#0d1117,fg=#8b949e"

# Izquierda: nombre de sesión en azul GitHub
set -g status-left "#[fg=#0d1117,bg=#58a6ff,bold] #S #[default] "

# Ventanas: activa en azul sobre superficie elevada, resto apagadas
set -g window-status-format "#[fg=#8b949e,bg=#0d1117] #I #W "
set -g window-status-current-format "#[fg=#58a6ff,bg=#21262d,bold] #I #W "
set -g window-status-separator ""

# Derecha: programa · CPU · host · hora
set -g status-right "#[fg=#6e7681]#{pane_current_command}  #[fg=#3fb950] #{cpu_percentage} #[fg=#e6edf3,bg=#21262d] #H #[fg=#0d1117,bg=#58a6ff,bold] %H:%M "

# Bordes de panel acordes al tema
set -g pane-border-style "fg=#21262d"
set -g pane-active-border-style "fg=#58a6ff"

# Mensajes y modo copia
set -g message-style "bg=#21262d,fg=#e6edf3"
set -g message-command-style "bg=#21262d,fg=#e6edf3"
set -g mode-style "bg=#58a6ff,fg=#0d1117"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'ofirgall/tmux-window-name'

# tmux-window-name (requiere: python3 -m pip install --user libtmux)
set -g automatic-rename off # el plugin maneja los nombres, evitar conflicto
set -g @tmux_window_name_use_tilde "True"
set -g @tmux_window_name_show_program_args "False"
set -g @tmux_window_name_max_name_len "25"

# Inicializar TPM
run '~/.tmux/plugins/tpm/tpm'

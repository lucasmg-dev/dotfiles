# Shell
set-option -g default-shell /opt/homebrew/bin/fish

# Soporte de colores
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse
set -g mouse on

# Empezar índices en 1
set -g base-index 1
setw -g pane-base-index 1

# Renumerar ventanas al cerrar
set -g renumber-windows on

# Historial
set -g history-limit 50000

# Prefix: Ctrl+a (más cómodo que Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# División de paneles más intuitiva
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navegación entre paneles estilo vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Recargar configuración
bind r source-file ~/.tmux.conf \; display-message "Config recargada"

# Sin delay en escape
set -sg escape-time 0

# Bordes de paneles
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style "fg=#626880"
set -g pane-active-border-style "fg=#8caaee"

# Status bar
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#303446,fg=#c6d0f5"
set -g status-format[0] "#{W:#{T:window-status-format},#{T:window-status-current-format}}#[align=right]#{E:status-right}"
set -g status-left ""
set -g status-right-length 150
set -g status-right "#[fg=#303446,bg=#ef9f76] #S #[fg=#303446,bg=#8caaee] #H #[fg=#303446,bg=#ca9ee6]  #{cpu_percentage} #[fg=#303446,bg=#ca9ee6]  #{ram_percentage} #[fg=#303446,bg=#e5c890] %H:%M  "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#838ba7,bg=#303446]  #I:#W  "
setw -g window-status-current-format "#[fg=#303446,bg=#8caaee,bold]  #I:#W  "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Inicializar TPM
run '~/.tmux/plugins/tpm/tpm'

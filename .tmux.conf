# Shell
set-option -g default-shell /opt/homebrew/bin/fish

# Soporte de colores
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse
set -g mouse on

# Empezar índices en 1
set -g base-index 1
setw -g pane-base-index 1

# Renumerar ventanas al cerrar
set -g renumber-windows on

# Historial
set -g history-limit 50000

# Prefix: Ctrl+a (más cómodo que Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# División de paneles más intuitiva
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navegación entre paneles estilo vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Recargar configuración
bind r source-file ~/.tmux.conf \; display-message "Config recargada"

# Sin delay en escape
set -sg escape-time 0

# Bordes de paneles
set -g pane-border-lines single
set -g pane-border-indicators off

# Status bar (el theming lo maneja rose-pine/tmux)
set -g status on
set -g status-position top
set -g status-justify left
set -g status-right-length 150

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rose-pine/tmux'

# Rosé Pine theme
# OJO: no setear opciones en 'off' — el plugin chequea [[ -n "$var" ]] en varios
# lados, así que 'off' (string no vacío) las ACTIVA. Omitir = desactivada.
set -g @rose_pine_variant 'main' # otras: 'moon', 'dawn'
set -g @rose_pine_host 'on'
set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_show_current_program 'on'

# Inicializar TPM
run '~/.tmux/plugins/tpm/tpm'

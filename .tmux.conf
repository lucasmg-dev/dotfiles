# Shell
set-option -g default-shell /opt/homebrew/bin/fish

# Soporte de colores
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse
set -g mouse on

# Empezar índices en 1
set -g base-index 1
setw -g pane-base-index 1

# Renumerar ventanas al cerrar
set -g renumber-windows on

# Historial
set -g history-limit 50000

# Prefix: Ctrl+a (más cómodo que Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# División de paneles más intuitiva
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navegación entre paneles estilo vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Recargar configuración
bind r source-file ~/.tmux.conf \; display "Config recargada"

# Sin delay en escape
set -sg escape-time 0

# Bordes de paneles
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#585b70"

# Status bar
set -g status-position top

# Catppuccin
set -g @catppuccin_flavor "mocha"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Inicializar TPM (carga catppuccin y define @thm_* variables)
run '~/.tmux/plugins/tpm/tpm'

# Windows (después de TPM para que las variables @thm_* existan)
set -gF window-status-format "#[bg=#{@thm_surface_1},fg=#{@thm_fg}] ##I ##T "
set -gF window-status-current-format "#[bg=#{@thm_mauve},fg=#{@thm_crust}] ##I ##T "

# Status bar content
set -g status-left ""
set -g status-right-length 60
set -g status-right "#[bg=#a6e3a1,fg=#11111b] CPU #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) #[bg=default] #[bg=#f2cdcd,fg=#11111b] MEM #(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh) "
set -g status-interval 5

add_newline = false
command_timeout = 1000

format = """
$directory$git_branch$git_status$nodejs$python$rust$cmd_duration
$character
"""

# --- Prompt character ---
[character]
success_symbol = "[>](bold #a6d189)"
error_symbol = "[>](bold #e78284)"
vicmd_symbol = "[<](bold #a6d189)"

# --- Directory ---
[directory]
style = "bold #8caaee"
format = "[$path]($style)"
truncation_length = 3

# --- Git ---
[git_branch]
format = "[ $symbol$branch]($style)"
style = "#ca9ee6"
symbol = "git "

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "#e5c890"
conflicted = "!"
ahead = " ahead"
behind = " behind"
diverged = " diverged"

# --- Runtimes ---
[nodejs]
symbol = "node "
style = "#a6d189"
format = "[ $symbol($version)]($style)"

[python]
symbol = "py "
style = "#81c8be"
format = "[ $symbol($version)]($style)"

[rust]
symbol = "rs "
style = "#ef9f76"
format = "[ $symbol($version)]($style)"

# --- Command duration ---
[cmd_duration]
style = "#c6d0f5"
